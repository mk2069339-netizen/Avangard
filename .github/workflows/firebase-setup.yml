name: Firebase bir martalik sozlash (login + qoidalar)

on:
  workflow_dispatch:
  push:
    branches: [claude/m3nga-avangard-ilovasi-efcl2c]
    paths: ['scripts/firebase-setup.mjs', 'firestore.rules', '.github/workflows/firebase-setup.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save google-auth-library@10
      - name: Sozlash
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/firebase-setup.mjs
          rm -f "$RUNNER_TEMP/sa.json"
